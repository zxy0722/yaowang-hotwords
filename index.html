/* ══════════════ 图表渲染 ══════════════ */
const chart = echarts.init(document.getElementById('graph'));
chart.setOption({
  backgroundColor: 'transparent',
  tooltip: {
    backgroundColor: 'rgba(60,40,20,.92)',
    borderColor: '#c8a86b',
    textStyle: { color: '#f7ecd7', fontSize: 13 },
    formatter: p => p.dataType === 'node'
      ? `<b style="color:#ffd98e">${p.name.replace(/\n/g,'')}</b><br>${p.data.value || ''}<br><span style="color:#8fd0ff">点击查看详情 →</span>`
      : `${p.data.source.replace(/\n/g,'')} → ${p.data.target.replace(/\n/g,'')}`
  },
  series: [{
    type: 'graph', layout: 'force',
    categories, data: nodes, links,
    roam: true, draggable: true, zoom: 0.85, center: ['50%', '50%'],
    force: { repulsion: 520, edgeLength: [55, 140], gravity: 0.1, friction: 0.22 },
    label: { show: true, position: 'inside', fontSize: 11, color: '#fff', lineHeight: 14, formatter: '{b}' },
    itemStyle: { borderColor: 'rgba(255,250,235,.85)', borderWidth: 2, shadowBlur: 12, shadowColor: 'rgba(90,60,20,.35)' },
    lineStyle: { color: '#b89a6a', width: 1.3, opacity: 0.7, curveness: 0.12 },
    emphasis: { focus: 'adjacency', lineStyle: { width: 3, opacity: 1 }, label: { fontWeight: 'bold' } }
  }]
});
window.addEventListener('resize', () => chart.resize());

/* ══════════════ 邻接关系 ══════════════ */
const adjacency = {};
links.forEach(l => {
  (adjacency[l.source] = adjacency[l.source] || new Set()).add(l.target);
  (adjacency[l.target] = adjacency[l.target] || new Set()).add(l.source);
});
const nodeMap = {};
nodes.forEach(n => nodeMap[n.name] = n);

/* ══════════════ 详情页逻辑 ══════════════ */
let navStack = [];

function extractScenes(text) {
  const ids = new Set();
  const m = text.match(/场景[\d\/、]+/g) || [];
  m.forEach(seg => seg.replace('场景','').split(/[\/、]/).forEach(id => { if (scenes[id]) ids.add(id); }));
  return [...ids];
}

function openDetail(name, push = true) {
  const n = nodeMap[name];
  if (!n) return;
  if (push) navStack.push(name);
  const plain = name.replace(/\n/g, '');
  const catIdx = n.category;

  document.getElementById('dCrumb').textContent =
    `药王孙思邈康养养生热词关联图 / ${categories[catIdx].name} / ${plain}`;
  document.getElementById('dTitle').textContent = plain;
  const badge = document.getElementById('dBadge');
  badge.textContent = categories[catIdx].name;
  badge.style.background = catColors[catIdx];

  document.getElementById('dBrief').innerHTML =
    `<p style="margin-bottom:8px">${n.value || ''}</p>
     <p style="font-size:13px;color:#a68a5b">所属热词簇：${categories[catIdx].name} — ${catIntro[catIdx]}</p>`;

  // 详细解读
  const more = moreDetails[name];
  const moreSec = document.getElementById('dMoreSec');
  if (more) {
    moreSec.style.display = 'block';
    document.getElementById('dMore').innerHTML = more.map(p => `<p>${p}</p>`).join('');
  } else moreSec.style.display = 'none';

  // 场景溯源
  const scIds = extractScenes(n.value || '');
  const scSec = document.getElementById('dSceneSec');
  if (scIds.length) {
    scSec.style.display = 'block';
    document.getElementById('dScenes').innerHTML = scIds.map(id => {
      const s = scenes[id];
      return `<div class="scene-card">
        <span class="no">场景 ${id}</span><span class="nm">${s.name}</span>
        <div class="ds">${s.desc}</div>
        <div class="cat">${s.cat} · 《铜川市数据要素场景机会清单》</div>
      </div>`;
    }).join('');
  } else scSec.style.display = 'none';

  // 相关热词
  const rel = [...(adjacency[name] || [])].filter(x => nodeMap[x]);
  document.getElementById('dRelated').innerHTML = rel.map(x =>
    `<span class="rel-chip" onclick="openDetail('${x.replace(/'/g,"\\'")}')">
       <span class="dot" style="background:${catColors[nodeMap[x].category]};display:inline-block"></span>
       ${x.replace(/\n/g,'')}</span>`
  ).join('') || '<span style="color:#9a8465;font-size:13px">无</span>';

  // 外部链接
  const ext = [
    { label: '🗺️ 药王山景区信息', url: `https://cn.bing.com/search?q=${encodeURIComponent('铜川 药王山景区')}`, cls: '' }
  ];
  document.getElementById('dExt').innerHTML = ext.map(e =>
    `<a class="btn ${e.cls}" href="${e.url}" target="_blank" rel="noopener">${e.label}</a>`
  ).join('');

  document.getElementById('detailView').classList.add('show');
  document.getElementById('detailView').scrollTop = 0;
  location.hash = 'w=' + encodeURIComponent(name);
}

function closeDetail() {
  document.getElementById('detailView').classList.remove('show');
  history.replaceState(null, '', location.pathname);
}
function historyBack() {
  navStack.pop();
  const prev = navStack.pop();
  if (prev) openDetail(prev); else closeDetail();
}
function copyLink() {
  navigator.clipboard.writeText(location.href).then(() => alert('链接已复制，可直接分享定位到本热词详情页'));
}

chart.on('click', p => { if (p.dataType === 'node') openDetail(p.name); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

/* ══════════════ 索引搜索 ══════════════ */
const idxList = document.getElementById('indexList');
function renderIndex(filter = '') {
  idxList.innerHTML = nodes
    .filter(n => !filter || n.name.replace(/\n/g,'').includes(filter))
    .map(n => `<div class="idx-item" onclick="openDetail('${n.name.replace(/'/g,"\\'")}')">
      <span class="dot" style="background:${catColors[n.category]}"></span>${n.name.replace(/\n/g,'')}</div>`)
    .join('');
}
document.getElementById('searchBox').addEventListener('input', e => renderIndex(e.target.value.trim()));
renderIndex();

/* ══════════════ URL锚点直达 ══════════════ */
(function () {
  const m = location.hash.match(/#w=(.+)/);
  if (m) {
    const name = decodeURIComponent(m[1]);
    if (nodeMap[name]) setTimeout(() => openDetail(name, false), 300);
  }
})();
